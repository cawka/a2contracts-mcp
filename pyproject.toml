[project]
name = "a2contracts-mcp"
version = "0.1.0"
description = "MCP server for A2 Contracts: lets an external agent (Claude Code, Claude, Gemini) read projects and plans and draft plan markups through the app's own REST API."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.scripts]
a2contracts-mcp = "a2contracts_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a2contracts_mcp*"]
